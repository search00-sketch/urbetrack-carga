<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DGFIS · Devoluciones de mercadería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#181b1c;
    --bg-panel:#232728;
    --bg-panel-2:#2b3032;
    --steel-line:#3c4245;
    --steel-line-light:#4d5457;
    --yellow:#f2b705;
    --yellow-dim:#8a6c1f;
    --rust:#c1440e;
    --green:#4c8a52;
    --red:#a6291d;
    --text-hi:#f0eee8;
    --text-mid:#b7bdbf;
    --text-dim:#7d8688;
    --radius:2px;
    --shadow-plate: inset 0 0 0 1px rgba(255,255,255,0.03), 0 6px 16px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px),
      var(--bg-base);
    color:var(--text-hi);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
  }
  h1,h2,h3,.label-industrial{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  ::selection{ background:var(--yellow); color:#181b1c; }

  /* ---------- RIVETS / PLATE ---------- */
  .plate{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--steel-line);
    box-shadow:var(--shadow-plate);
    border-radius:var(--radius);
  }
  .plate::before,.plate::after{
    content:"";
    position:absolute;
    width:6px;height:6px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #6b7275, #24282a 70%);
    box-shadow:0 1px 1px rgba(0,0,0,0.6);
    top:8px;
  }
  .plate::before{ left:8px; }
  .plate::after{ right:8px; }
  .plate-rivet-bottom::before,.plate-rivet-bottom::after{
    content:"";
    position:absolute;
    width:6px;height:6px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #6b7275, #24282a 70%);
    box-shadow:0 1px 1px rgba(0,0,0,0.6);
    bottom:8px;
  }
  .plate-rivet-bottom::before{ left:8px; }
  .plate-rivet-bottom::after{ right:8px; }

  /* ---------- LOGIN ---------- */
  #pantalla-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:360px;
    padding:32px 28px 28px;
  }
  .login-card .hazard{
    height:6px;
    margin:-1px -1px 24px -1px;
    background: repeating-linear-gradient(45deg, var(--yellow) 0 10px, #181b1c 10px 20px);
  }
  .login-card h1{ font-size:20px; margin:0 0 4px; color:var(--text-hi); }
  .login-card p.sub{ color:var(--text-dim); font-size:12px; margin:0 0 24px; }
  .campo{ margin-bottom:16px; }
  .campo label{ display:block; font-size:11px; color:var(--text-mid); margin-bottom:6px; font-family:'Oswald',sans-serif; letter-spacing:0.05em; text-transform:uppercase;}
  .campo input, .campo select, .campo textarea{
    width:100%;
    background:var(--bg-base);
    border:1px solid var(--steel-line);
    color:var(--text-hi);
    padding:10px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    border-radius:var(--radius);
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus{
    outline:2px solid var(--yellow);
    outline-offset:1px;
    border-color:var(--yellow-dim);
  }
  .error-msg{ color:var(--red); font-size:12px; margin-top:10px; min-height:14px; }

  .btn-industrial{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:13px;
    padding:12px 18px;
    border:1px solid var(--steel-line-light);
    background:var(--bg-panel-2);
    color:var(--text-hi);
    cursor:pointer;
    border-radius:var(--radius);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 0 rgba(0,0,0,0.4);
  }
  .btn-industrial:active{ transform:translateY(1px); box-shadow:none; }
  .btn-industrial--primary{
    background:var(--yellow);
    color:#221a02;
    border-color:#a9860a;
  }
  .btn-industrial--full{ width:100%; }
  .btn-industrial:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ---------- APP SHELL ---------- */
  #app{ display:none; min-height:100vh; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:var(--bg-panel);
    border-bottom:3px solid var(--yellow);
  }
  .topbar h1{ font-size:16px; margin:0; color:var(--text-hi); }
  .topbar .planta{ font-size:10px; color:var(--text-dim); letter-spacing:0.08em; }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .topbar-right .usuario{ font-size:12px; color:var(--text-mid); }

  .toolbar{
    display:flex; flex-wrap:wrap; gap:12px; align-items:end;
    padding:16px 22px;
    border-bottom:1px solid var(--steel-line);
  }
  .toolbar .campo{ margin-bottom:0; min-width:180px; }
  .toolbar .campo.buscar{ flex:1; min-width:220px; }
  .contador-resultados{ font-size:11px; color:var(--text-dim); margin-left:auto; align-self:center;}

  main{ flex:1; padding:18px 22px 60px; overflow:auto; }

  table.manifest{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.manifest thead th{
    text-align:left;
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:0.05em;
    color:var(--text-dim);
    padding:8px 10px;
    border-bottom:2px solid var(--yellow-dim);
    position:sticky; top:0;
    background:var(--bg-base);
  }
  table.manifest tbody tr{
    border-bottom:1px solid var(--steel-line);
    cursor:pointer;
  }
  table.manifest tbody tr:hover{ background:var(--bg-panel); }
  table.manifest td{ padding:9px 10px; vertical-align:middle; color:var(--text-mid); }
  table.manifest td.id-col{ color:var(--text-hi); font-weight:600; }

  .badge-estado{
    display:inline-block;
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:0.04em;
    padding:3px 8px;
    border-radius:2px;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .estado-nota-enviada{ background:#2b3032; color:#c9c2a0; border-color:var(--steel-line-light); }
  .estado-en-busqueda{ background:#3a2f0a; color:var(--yellow); border-color:var(--yellow-dim); }
  .estado-en-proceso-de-entrega{ background:#1e3a4c; color:#7ec7e8; border-color:#2f6a86; }
  .estado-infractor-no-retira{ background:#4a2410; color:#e39a63; border-color:var(--rust); }
  .estado-entregado{ background:#1d3320; color:#8fd39a; border-color:var(--green); }
  .estado-decomiso{ background:#3a1512; color:#e8817a; border-color:var(--red); }
  .estado-sin-respuesta{ background:#2b3032; color:var(--text-dim); border-color:var(--steel-line-light); }

  .vacio{ text-align:center; padding:60px 20px; color:var(--text-dim); }

  /* ---------- PANEL LATERAL (ficha) ---------- */
  .overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    z-index:50;
  }
  .ficha{
    position:fixed; top:0; right:0; bottom:0;
    width:min(560px, 100%);
    background:var(--bg-base);
    border-left:3px solid var(--yellow);
    z-index:51;
    display:flex; flex-direction:column;
    box-shadow:-8px 0 24px rgba(0,0,0,0.4);
  }
  .ficha-header{
    padding:18px 22px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--steel-line);
    display:flex; justify-content:space-between; align-items:start;
  }
  .ficha-header h2{ font-size:16px; margin:0 0 4px; }
  .ficha-header .id-tag{ font-size:11px; color:var(--yellow); }
  .cerrar-ficha{ background:none; border:none; color:var(--text-mid); font-size:20px; cursor:pointer; line-height:1;}

  .ficha-body{ flex:1; overflow-y:auto; padding:18px 22px; }
  .seccion-titulo{
    font-size:11px; color:var(--text-dim);
    margin:22px 0 10px; padding-bottom:6px;
    border-bottom:1px dashed var(--steel-line);
  }
  .seccion-titulo:first-child{ margin-top:0; }
  .solo-lectura-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; font-size:12px; }
  .solo-lectura-grid div span.k{ display:block; color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  .solo-lectura-grid div span.v{ color:var(--text-mid); }

  .fila-contacto{
    display:grid; grid-template-columns:130px 1fr; gap:10px;
    align-items:start;
    margin-bottom:12px;
  }
  .ficha-footer{
    padding:16px 22px;
    border-top:1px solid var(--steel-line);
    background:var(--bg-panel);
    display:flex; gap:10px; align-items:center;
  }
  .guardado-msg{ font-size:11px; color:var(--green); }
  .guardado-msg.error{ color:var(--red); }

  @media (max-width: 640px){
    table.manifest thead{ display:none; }
    table.manifest, table.manifest tbody, table.manifest tr, table.manifest td{ display:block; width:100%; }
    table.manifest tr{ padding:10px 4px; }
    table.manifest td{ padding:3px 6px; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="pantalla-login">
  <div class="plate plate-rivet-bottom login-card">
    <div class="hazard"></div>
    <h1>Devoluciones DGFIS</h1>
    <p class="sub">Gestión de mercadería en depósito — acceso restringido</p>
    <form id="form-login">
      <div class="campo">
        <label for="email">Usuario (email)</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="campo">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-industrial btn-industrial--primary btn-industrial--full">Ingresar</button>
      <div class="error-msg" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <div>
      <h1>Devoluciones DGFIS</h1>
      <div class="planta">Gerencia de Venta Sin Permiso</div>
    </div>
    <div class="topbar-right">
      <span class="usuario" id="usuario-actual"></span>
      <button class="btn-industrial" id="btn-refrescar">↻ Refrescar</button>
      <button class="btn-industrial" id="btn-logout">Salir</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="campo buscar">
      <label>Buscar (ID, contacto, artículo)</label>
      <input type="text" id="filtro-texto" placeholder="Ej: 245, Juan Pérez, indumentaria..." />
    </div>
    <div class="campo">
      <label>Estado</label>
      <select id="filtro-estado">
        <option value="">Todos</option>
        <option value="NOTA ENVIADA">Nota enviada</option>
        <option value="EN BUSQUEDA">En búsqueda</option>
        <option value="EN PROCESO DE ENTREGA">En proceso de entrega</option>
        <option value="INFRACTOR NO RETIRA">Infractor no retira</option>
        <option value="ENTREGADO">Entregado</option>
        <option value="DECOMISO">Decomiso</option>
        <option value="SIN RESPUESTA">Sin respuesta</option>
      </select>
    </div>
    <div class="contador-resultados" id="contador"></div>
  </div>

  <main>
    <table class="manifest" id="tabla-manifest">
      <thead>
        <tr>
          <th>ID</th>
          <th>Contacto</th>
          <th>Teléfono</th>
          <th>Artículo</th>
          <th>Fecha entrega</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tbody-manifest"></tbody>
    </table>
    <div class="vacio" id="vacio" style="display:none;">No hay expedientes que coincidan con el filtro.</div>
  </main>
</div>

<!-- ============ FICHA (panel lateral) ============ -->
<div class="overlay" id="overlay"></div>
<div class="ficha" id="ficha">
  <div class="ficha-header">
    <div>
      <h2>Expediente</h2>
      <div class="id-tag" id="ficha-id"></div>
    </div>
    <button class="cerrar-ficha" id="cerrar-ficha">✕</button>
  </div>
  <div class="ficha-body" id="ficha-body">
    <!-- se completa por JS -->
  </div>
  <div class="ficha-footer">
    <button class="btn-industrial btn-industrial--primary" id="btn-guardar">Guardar cambios</button>
    <span class="guardado-msg" id="guardado-msg"></span>
  </div>
</div>

<script type="module">
// ==========================================================================
// CONFIGURACIÓN — completar antes de desplegar
// ==========================================================================
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID",
};

// URLs de los triggers HTTP de Power Automate (ver GUIA-SETUP-POWER-AUTOMATE-FIREBASE.md)
const URL_LEER = "https://default2377472e800446488456bd9687afa1.50.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2cc65446812e442da2a014d3738c096d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=XUk4HSXZr2jwnNhTFmUFEiT83UhOOEI6cSILdiFutds";
const URL_ACTUALIZAR = "https://PEGAR_URL_FLOW_ACTUALIZAR";

// Si configuraste un encabezado secreto en los flows, completalo acá:
const CLAVE_INTERNA = "";

// ==========================================================================
// FIREBASE
// ==========================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

// ==========================================================================
// CATÁLOGOS (listas fijas de columnas J-W)
// ==========================================================================
const OPCIONES_SE_ENCUENTRA = ["SI", "NO", "PARCIAL"];

const OPCIONES_TIPO_ARTICULO = [
  "INDUMENTARIA", "GASTRONOMIA", "CARRO / CARRITO", "PARRILLA", "DECK",
  "ACCESORIOS", "HIGIENE / LIMPIEZA", "CALZADO", "JUGUETES", "BAZAR",
  "TEXTIL / TELAS", "ESTRUCTURA (deck, gazebo, valla, pallets)",
  "PUESTO DE DIARIOS", "FLORERIA", "LIBRERIA", "COSMETICA / PERFUMERIA",
  "ARTESANIAS", "GENERADOR / GRUPO ELECTROGENO", "ELEMENTOS DE DESALOJO",
  "DECOMISO", "ART. VARIOS", "OTRO",
];

const OPCIONES_ESTADO = [
  "NOTA ENVIADA", "EN BUSQUEDA", "EN PROCESO DE ENTREGA",
  "INFRACTOR NO RETIRA", "ENTREGADO", "DECOMISO", "SIN RESPUESTA",
];

function claseEstado(estado) {
  return "estado-" + (estado || "").toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "");
}

// ==========================================================================
// ESTADO EN MEMORIA (nada de localStorage: vive mientras la pestaña está abierta)
// ==========================================================================
let expedientes = [];
let expedienteAbiertoId = null;
let cambiosPendientes = {};

// ==========================================================================
// LOGIN
// ==========================================================================
const pantallaLogin = document.getElementById("pantalla-login");
const appEl = document.getElementById("app");
const formLogin = document.getElementById("form-login");
const loginError = document.getElementById("login-error");

formLogin.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.textContent = "";
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) {
    loginError.textContent = "No se pudo ingresar. Revisá usuario y contraseña.";
  }
});

document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    pantallaLogin.style.display = "none";
    appEl.style.display = "flex";
    document.getElementById("usuario-actual").textContent = user.email;
    cargarExpedientes();
  } else {
    pantallaLogin.style.display = "flex";
    appEl.style.display = "none";
  }
});

// ==========================================================================
// CARGA DE DATOS (Flow 1: leer)
// ==========================================================================
async function cargarExpedientes() {
  const tbody = document.getElementById("tbody-manifest");
  tbody.innerHTML = `<tr><td colspan="6" style="padding:20px;color:var(--text-dim);">Cargando expedientes...</td></tr>`;
  try {
    const resp = await fetch(URL_LEER, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(CLAVE_INTERNA ? { "x-clave-interna": CLAVE_INTERNA } : {}) },
    });
    if (!resp.ok) throw new Error("Respuesta no OK del flow de lectura");
    const data = await resp.json();
    // El flow envuelve el array bajo la clave "result"
    expedientes = Array.isArray(data) ? data : (data.result || []);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6" style="padding:20px;color:var(--red);">No se pudo cargar el listado. Verificá la conexión con Power Automate. (${err.message})</td></tr>`;
    return;
  }
  renderLista();
}

document.getElementById("btn-refrescar").addEventListener("click", cargarExpedientes);
document.getElementById("filtro-texto").addEventListener("input", renderLista);
document.getElementById("filtro-estado").addEventListener("change", renderLista);

// ==========================================================================
// RENDER DE LA LISTA (manifest)
// ==========================================================================
function renderLista() {
  const texto = document.getElementById("filtro-texto").value.trim().toLowerCase();
  const estadoFiltro = document.getElementById("filtro-estado").value;

  const filtrados = expedientes.filter((e) => {
    const coincideTexto = !texto || [e.id, e.nombreContacto, e.telefonoContacto, e.articulo, e.tipoArticulo]
      .some((v) => (v || "").toLowerCase().includes(texto));
    const coincideEstado = !estadoFiltro || e.estado === estadoFiltro;
    return coincideTexto && coincideEstado;
  });

  const tbody = document.getElementById("tbody-manifest");
  const vacio = document.getElementById("vacio");
  document.getElementById("contador").textContent = `${filtrados.length} de ${expedientes.length} expedientes`;

  if (filtrados.length === 0) {
    tbody.innerHTML = "";
    vacio.style.display = "block";
    return;
  }
  vacio.style.display = "none";

  tbody.innerHTML = filtrados.map((e) => `
    <tr data-id="${escapeHtml(e.id)}">
      <td class="id-col">${escapeHtml(e.id)}</td>
      <td>${escapeHtml(e.nombreContacto || "—")}</td>
      <td>${escapeHtml(e.telefonoContacto || "—")}</td>
      <td>${escapeHtml(e.articulo || e.tipoArticulo || "—")}</td>
      <td>${escapeHtml(e.fechaEntrega || "—")}</td>
      <td><span class="badge-estado ${claseEstado(e.estado)}">${escapeHtml(e.estado || "sin estado")}</span></td>
    </tr>
  `).join("");

  tbody.querySelectorAll("tr").forEach((tr) => {
    tr.addEventListener("click", () => abrirFicha(tr.dataset.id));
  });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// ==========================================================================
// FICHA (panel lateral de edición)
// ==========================================================================
const overlay = document.getElementById("overlay");
const ficha = document.getElementById("ficha");

function abrirFicha(id) {
  const exp = expedientes.find((e) => String(e.id) === String(id));
  if (!exp) return;
  expedienteAbiertoId = id;
  cambiosPendientes = {};
  document.getElementById("guardado-msg").textContent = "";

  document.getElementById("ficha-id").textContent = `ID ${exp.id}`;

  document.getElementById("ficha-body").innerHTML = `
    <div class="seccion-titulo">Datos de legales (solo lectura)</div>
    <div class="solo-lectura-grid">
      <div><span class="k">Fecha acta</span><span class="v">${escapeHtml(exp.fechaActa || "—")}</span></div>
      <div><span class="k">N° acta secuestro</span><span class="v">${escapeHtml(exp.actaSecuestro || "—")}</span></div>
      <div><span class="k">N° acta comprobación</span><span class="v">${escapeHtml(exp.actaComprobacion || "—")}</span></div>
      <div><span class="k">N° nota</span><span class="v">${escapeHtml(exp.nNota || "—")}</span></div>
      <div><span class="k">Fecha ingreso nota</span><span class="v">${escapeHtml(exp.fechaIngresoNota || "—")}</span></div>
      <div><span class="k">Fecha envío a depósito</span><span class="v">${escapeHtml(exp.fechaEnvioDepo || "—")}</span></div>
      <div><span class="k">Nombre contacto</span><span class="v">${escapeHtml(exp.nombreContacto || "—")}</span></div>
      <div><span class="k">Teléfono contacto</span><span class="v">${escapeHtml(exp.telefonoContacto || "—")}</span></div>
    </div>

    <div class="seccion-titulo">Búsqueda del artículo</div>
    <div class="campo">
      <label>¿Se encuentra el artículo?</label>
      <select data-campo="J">${opcionesSelect(OPCIONES_SE_ENCUENTRA, exp.seEncuentraArticulo)}</select>
    </div>
    <div class="campo">
      <label>Fecha en que se encuentra</label>
      <input type="date" data-campo="K" value="${exp.fechaSeEncuentra || ""}" />
    </div>

    <div class="seccion-titulo">Contactos</div>
    <div class="fila-contacto">
      <input type="date" data-campo="L" value="${exp.fechaContacto1 || ""}" />
      <input type="text" data-campo="M" placeholder="Observación contacto 1" value="${escapeHtml(exp.obs1 || "")}" />
    </div>
    <div class="fila-contacto">
      <input type="date" data-campo="N" value="${exp.fechaContacto2 || ""}" />
      <input type="text" data-campo="O" placeholder="Observación contacto 2" value="${escapeHtml(exp.obs2 || "")}" />
    </div>
    <div class="fila-contacto">
      <input type="date" data-campo="P" value="${exp.fechaContacto3 || ""}" />
      <input type="text" data-campo="Q" placeholder="Observación contacto 3" value="${escapeHtml(exp.obs3 || "")}" />
    </div>

    <div class="seccion-titulo">Entrega</div>
    <div class="campo">
      <label>Fecha de entrega</label>
      <input type="date" data-campo="R" value="${exp.fechaEntrega || ""}" />
    </div>
    <div class="campo">
      <label>Tipo de artículo</label>
      <select data-campo="S">${opcionesSelect(OPCIONES_TIPO_ARTICULO, exp.tipoArticulo)}</select>
    </div>
    <div class="campo">
      <label>Artículo</label>
      <input type="text" data-campo="T" value="${escapeHtml(exp.articulo || "")}" />
    </div>
    <div class="campo">
      <label>N° de precinto</label>
      <input type="text" data-campo="U" value="${escapeHtml(exp.nPrecinto || "")}" />
    </div>
    <div class="campo">
      <label>Estado</label>
      <select data-campo="V">${opcionesSelect(OPCIONES_ESTADO, exp.estado)}</select>
    </div>
    <div class="campo">
      <label>Remito entregado (N° de remito)</label>
      <input type="text" data-campo="W" value="${escapeHtml(exp.remitoEntregado || "")}" />
    </div>
  `;

  document.getElementById("ficha-body").querySelectorAll("[data-campo]").forEach((el) => {
    el.addEventListener("input", () => {
      cambiosPendientes[el.dataset.campo] = el.value;
    });
    el.addEventListener("change", () => {
      cambiosPendientes[el.dataset.campo] = el.value;
    });
  });

  overlay.style.display = "block";
  ficha.style.right = "0";
}

function opcionesSelect(opciones, valorActual) {
  return `<option value=""></option>` + opciones.map((op) =>
    `<option value="${escapeHtml(op)}" ${op === valorActual ? "selected" : ""}>${escapeHtml(op)}</option>`
  ).join("");
}

function cerrarFicha() {
  overlay.style.display = "none";
  expedienteAbiertoId = null;
  cambiosPendientes = {};
}
document.getElementById("cerrar-ficha").addEventListener("click", cerrarFicha);
overlay.addEventListener("click", cerrarFicha);

// ==========================================================================
// GUARDAR (Flow 2: actualizar) + log de auditoría en Firestore
// ==========================================================================
document.getElementById("btn-guardar").addEventListener("click", async () => {
  if (!expedienteAbiertoId) return;
  const msg = document.getElementById("guardado-msg");
  const btn = document.getElementById("btn-guardar");

  if (Object.keys(cambiosPendientes).length === 0) {
    msg.textContent = "No hay cambios para guardar.";
    msg.classList.remove("error");
    return;
  }

  btn.disabled = true;
  msg.textContent = "Guardando...";
  msg.classList.remove("error");

  try {
    const resp = await fetch(URL_ACTUALIZAR, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(CLAVE_INTERNA ? { "x-clave-interna": CLAVE_INTERNA } : {}) },
      body: JSON.stringify({ id: expedienteAbiertoId, campos: cambiosPendientes }),
    });
    const data = await resp.json();
    if (!resp.ok || data.ok === false) {
      throw new Error(data.mensaje || "El flow respondió un error.");
    }

    // Log de auditoría (no bloquea el flujo si falla)
    try {
      await addDoc(collection(db, "auditoria_devoluciones"), {
        expedienteId: expedienteAbiertoId,
        campos: cambiosPendientes,
        usuario: auth.currentUser?.email || "desconocido",
        fecha: serverTimestamp(),
      });
    } catch (e) { /* no crítico */ }

    // Actualiza la copia en memoria para que la lista refleje el cambio sin recargar todo
    const exp = expedientes.find((e) => String(e.id) === String(expedienteAbiertoId));
    if (exp) {
      const mapaCampo = { J:"seEncuentraArticulo", K:"fechaSeEncuentra", L:"fechaContacto1", M:"obs1",
        N:"fechaContacto2", O:"obs2", P:"fechaContacto3", Q:"obs3", R:"fechaEntrega",
        S:"tipoArticulo", T:"articulo", U:"nPrecinto", V:"estado", W:"remitoEntregado" };
      for (const letra of Object.keys(cambiosPendientes)) {
        if (mapaCampo[letra]) exp[mapaCampo[letra]] = cambiosPendientes[letra];
      }
    }

    msg.textContent = "Cambios guardados correctamente.";
    renderLista();
    setTimeout(cerrarFicha, 700);
  } catch (err) {
    msg.textContent = "Error al guardar: " + err.message;
    msg.classList.add("error");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
